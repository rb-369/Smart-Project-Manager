<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Electric Blue -->
    <linearGradient id="bgGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0051FF" />
      <stop offset="100%" stop-color="#002AD4" />
    </linearGradient>

    <!-- Neon Lime Glow -->
    <linearGradient id="limeGrad" x1="180" y1="120" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9FF43" />
      <stop offset="50%" stop-color="#C6FF20" />
      <stop offset="100%" stop-color="#A5E800" />
    </linearGradient>

    <!-- White Chevron Gloss -->
    <linearGradient id="whiteGrad" x1="280" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Pop -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00156E" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Border Base for Dark/Light Browser Tab Contrast -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#030C2E" />

  <!-- Electric Blue Squircle Container -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bgGrad)" stroke="#3875FF" stroke-width="4" />

  <!-- Inner Ambient Glow Line -->
  <rect x="42" y="42" width="428" height="428" rx="94" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" />

  <!-- Centered Emblem Mark -->
  <g filter="url(#iconShadow)">
    <!-- Neon Lime Lightning Velocity Bolt (Left) -->
    <path
      d="M208 116 L288 116 L226 232 L286 232 L150 408 L184 274 L140 274 Z"
      fill="url(#limeGrad)"
    />

    <!-- White Command Chevron / Hex Bracket (Right) -->
    <path
      d="M306 132 L394 256 L306 380 L254 380 L336 264 L336 248 L254 132 Z"
      fill="url(#whiteGrad)"
    />
  </g>
</svg>
