version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: devcommand-db
    environment:
      POSTGRES_USER: devcommand
      POSTGRES_PASSWORD: devcommand_password
      POSTGRES_DB: devcommand
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcommand -d devcommand"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcommand-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://devcommand:devcommand_password@db:5432/devcommand
      - SECRET_KEY=super_secure_docker_secret_key_change_me_123456789
      - FERNET_ENCRYPTION_KEY=dGhpcy1pcy1hLWR1bW15LWtleS1mb3ItZGV2LWV4YW1wbGUtMTIzNDU=
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: devcommand-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
